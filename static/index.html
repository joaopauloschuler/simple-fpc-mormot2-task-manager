
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mORMot2 Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            opacity: 0.8;
        }
        
        .content {
            padding: 30px;
        }
        
        .add-task-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .add-task-section h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .tasks-section h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .task-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #e9ecef;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .task-list {
            display: grid;
            gap: 15px;
        }
        
        .task-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .task-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        
        .task-card.completed {
            opacity: 0.7;
            background: #f8f9fa;
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .task-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #2c3e50;
            flex: 1;
        }
        
        .task-title.completed {
            text-decoration: line-through;
            color: #6c757d;
        }
        
        .task-priority {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .priority-high {
            background: #ff6b6b;
            color: white;
        }
        
        .priority-medium {
            background: #ffd93d;
            color: #333;
        }
        
        .priority-low {
            background: #6bcf7f;
            color: white;
        }
        
        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .task-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-complete {
            background: #6bcf7f;
        }
        
        .btn-delete {
            background: #ff6b6b;
        }
        
        .btn-edit {
            background: #ffd93d;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #6bcf7f;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            opacity: 0.9;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Task Manager</h1>
            <p>Powered by mORMot2 + Free Pascal</p>
        </header>
        
        <div class="content">
            <div id="message"></div>
            
            <div class="stats" id="stats" style="display:none;">
                <div class="stat-card">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-pending">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-completed">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
            
            <div class="add-task-section">
                <h2>➕ Create New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter task title">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Enter task description (optional)"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="1">Low</option>
                            <option value="2" selected>Medium</option>
                            <option value="3">High</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="text" id="dueDate" name="dueDate" placeholder="YYYY-MM-DD (optional)">
                    </div>
                    
                    <button type="submit">Create Task</button>
                </form>
            </div>
            
            <div class="tasks-section">
                <h2>📝 Your Tasks</h2>
                
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">All Tasks</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="in_progress">In Progress</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                
                <div id="taskList" class="task-list">
                    <div class="loading">Loading tasks...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8080/taskmanager';
        let currentFilter = 'all';
        
        // Show message
        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
        
        // Load tasks
        async function loadTasks(filter = '') {
            try {
                const url = `${API_BASE}/Task?select=*`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const tasks = await response.json();
                displayTasks(tasks, filter);
                updateStats(tasks);
            } catch (error) {
                document.getElementById('taskList').innerHTML = 
                    `<div class="error">Error loading tasks: ${error.message}</div>`;
            }
        }
        
        // Display tasks
        function displayTasks(tasks, filter) {
            const taskList = document.getElementById('taskList');
            
            // Filter tasks
            let filtered = tasks;
            if (filter && filter !== 'all') {
                filtered = tasks.filter(t => t.Status === filter);
            }
            
            if (filtered.length === 0) {
                taskList.innerHTML = '<div class="loading">No tasks found. Create your first task!</div>';
                return;
            }
            
            taskList.innerHTML = filtered.map(task => `
                <div class="task-card ${task.IsCompleted ? 'completed' : ''}">
                    <div class="task-header">
                        <div class="task-title ${task.IsCompleted ? 'completed' : ''}">${escapeHtml(task.Title)}</div>
                        <span class="task-priority priority-${getPriorityClass(task.Priority)}">${getPriorityName(task.Priority)}</span>
                    </div>
                    <div class="task-description">${escapeHtml(task.Description || 'No description')}</div>
                    <div class="task-meta">
                        <span>📅 Due: ${formatDate(task.DueDate)}</span>
                        <span>🏷️ Status: ${task.Status}</span>
                    </div>
                    <div class="task-actions">
                        ${!task.IsCompleted ? 
                            `<button class="btn-complete" onclick="toggleComplete(${task.ID}, true)">✓ Complete</button>` :
                            `<button class="btn-complete" onclick="toggleComplete(${task.ID}, false)">↺ Reopen</button>`
                        }
                        <button class="btn-delete" onclick="deleteTask(${task.ID})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Update statistics
        function updateStats(tasks) {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-pending').textContent = tasks.filter(t => !t.IsCompleted).length;
            document.getElementById('stat-completed').textContent = tasks.filter(t => t.IsCompleted).length;
        }
        
        // Create task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                Title: document.getElementById('title').value,
                Description: document.getElementById('description').value,
                Priority: parseInt(document.getElementById('priority').value),
                DueDate: document.getElementById('dueDate').value || null,
                Status: 'pending',
                IsCompleted: false,
                CreatedAt: new Date().toISOString(),
                UpdatedAt: new Date().toISOString()
            };
            
            try {
                const response = await fetch(`${API_BASE}/Task`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showMessage('Task created successfully!', 'success');
                document.getElementById('taskForm').reset();
                loadTasks(currentFilter);
            } catch (error) {
                showMessage(`Error creating task: ${error.message}`, 'error');
            }
        });
        
        // Toggle task completion
        async function toggleComplete(taskId, isComplete) {
            try {
                // First get the task
                const getResponse = await fetch(`${API_BASE}/Task/${taskId}`);
                const task = await getResponse.json();
                
                // Update it
                task.IsCompleted = isComplete;
                task.Status = isComplete ? 'completed' : 'pending';
                task.UpdatedAt = new Date().toISOString();
                
                const response = await fetch(`${API_BASE}/Task`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showMessage('Task updated!', 'success');
                loadTasks(currentFilter);
            } catch (error) {
                showMessage(`Error updating task: ${error.message}`, 'error');
            }
        }
        
        // Delete task
        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/Task/${taskId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                showMessage('Task deleted!', 'success');
                loadTasks(currentFilter);
            } catch (error) {
                showMessage(`Error deleting task: ${error.message}`, 'error');
            }
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadTasks(currentFilter === 'all' ? '' : currentFilter);
            });
        });
        
        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function getPriorityClass(priority) {
            return priority === 3 ? 'high' : priority === 2 ? 'medium' : 'low';
        }
        
        function getPriorityName(priority) {
            return priority === 3 ? 'High' : priority === 2 ? 'Medium' : 'Low';
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'No due date';
            const date = new Date(dateStr);
            return date.toLocaleDateString();
        }
        
        // Load tasks on page load
        loadTasks();
    </script>
</body>
</html>
