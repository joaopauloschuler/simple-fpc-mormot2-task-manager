
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mORMot2 Task Manager - Full Featured</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .sidebar {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        
        .main-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-success {
            background: #28a745;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            flex: 1;
            min-width: 100px;
        }
        
        .filter-btn.active {
            background: #764ba2;
        }
        
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .task-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .task-card.completed {
            opacity: 0.7;
            border-left-color: #28a745;
        }
        
        .task-card.priority-high {
            border-left-color: #dc3545;
        }
        
        .task-card.priority-medium {
            border-left-color: #ffc107;
        }
        
        .task-card.priority-low {
            border-left-color: #17a2b8;
        }
        
        .task-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .task-description {
            color: #666;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        
        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            font-size: 0.85em;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-priority {
            background: #e0e0e0;
            color: #333;
        }
        
        .badge-priority.high {
            background: #dc3545;
            color: white;
        }
        
        .badge-priority.medium {
            background: #ffc107;
            color: #333;
        }
        
        .badge-priority.low {
            background: #17a2b8;
            color: white;
        }
        
        .badge-status {
            background: #6c757d;
            color: white;
        }
        
        .task-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .tag {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            color: white;
            font-weight: 500;
        }
        
        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .modal-title {
            font-size: 1.8em;
            color: #333;
        }
        
        .close-btn {
            background: none;
            color: #999;
            font-size: 2em;
            padding: 0;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
        }
        
        .close-btn:hover {
            color: #333;
            background: #f0f0f0;
            transform: none;
            box-shadow: none;
        }
        
        .comments-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .comment {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 3px solid #667eea;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .comment-author {
            font-weight: 600;
            color: #667eea;
        }
        
        .comment-date {
            font-size: 0.85em;
            color: #999;
        }
        
        .comment-content {
            color: #333;
            line-height: 1.6;
        }
        
        .comment-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        
        .tag-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .tag-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
        
        .tag-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .tasks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 mORMot2 Task Manager</h1>
            <p>Full-Featured Task Management with Comments & Tags</p>
        </header>
        
        <div id="messageContainer"></div>
        
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <h2 class="section-title">➕ Create Task</h2>
                <form id="createTaskForm">
                    <div class="form-group">
                        <label for="taskTitle">Title *</label>
                        <input type="text" id="taskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="1">Low</option>
                            <option value="2" selected>Medium</option>
                            <option value="3">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <button type="submit">Create Task</button>
                </form>
                
                <h2 class="section-title" style="margin-top: 30px;">🏷️ Tag Management</h2>
                <form id="createTagForm">
                    <div class="form-group">
                        <label for="tagName">Tag Name *</label>
                        <input type="text" id="tagName" required>
                    </div>
                    <div class="form-group">
                        <label for="tagColor">Color</label>
                        <input type="color" id="tagColor" value="#667eea">
                    </div>
                    <button type="submit">Create Tag</button>
                </form>
                
                <div id="tagsList" style="margin-top: 15px;"></div>
            </div>
            
            <!-- Main Panel -->
            <div class="main-panel">
                <div class="stats-grid" id="statsGrid"></div>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Tasks</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="in_progress">In Progress</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                
                <div id="tasksContainer" class="tasks-grid"></div>
            </div>
        </div>
    </div>
    
    <!-- Task Detail Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTaskTitle"></h2>
                <button class="close-btn" onclick="closeTaskModal()">&times;</button>
            </div>
            <div id="modalTaskContent"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/taskmanager';
        let currentFilter = 'all';
        let allTasks = [];
        let allTags = [];
        let currentTaskId = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            loadTags();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Create task form
            document.getElementById('createTaskForm').addEventListener('submit', createTask);
            
            // Create tag form
            document.getElementById('createTagForm').addEventListener('submit', createTag);
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    displayTasks();
                });
            });
        }
        
        // API Calls
        async function callService(serviceName, methodName, params = []) {
            const url = `${API_BASE}/${serviceName}/${methodName}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const text = await response.text();
            return text ? JSON.parse(text) : null;
        }
        
        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE}/Task?select=*`);
                if (!response.ok) throw new Error('Failed to load tasks');
                
                allTasks = await response.json();
                displayTasks();
                updateStats();
            } catch (error) {
                showMessage(`Error loading tasks: ${error.message}`, 'error');
            }
        }
        
        async function loadTags() {
            try {
                allTags = await callService('TagService', 'ListTags');
                displayTagsList();
            } catch (error) {
                console.error('Error loading tags:', error);
            }
        }
        
        async function createTask(e) {
            e.preventDefault();
            
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = parseInt(document.getElementById('taskPriority').value);
            const dueDate = document.getElementById('taskDueDate').value;
            
            try {
                await callService('TaskService', 'CreateTask', [title, description, priority, dueDate]);
                showMessage('Task created successfully!', 'success');
                document.getElementById('createTaskForm').reset();
                loadTasks();
            } catch (error) {
                showMessage(`Error creating task: ${error.message}`, 'error');
            }
        }
        
        async function createTag(e) {
            e.preventDefault();
            
            const name = document.getElementById('tagName').value;
            const color = document.getElementById('tagColor').value;
            
            try {
                await callService('TagService', 'CreateTag', [name, color]);
                showMessage('Tag created successfully!', 'success');
                document.getElementById('createTagForm').reset();
                loadTags();
            } catch (error) {
                showMessage(`Error creating tag: ${error.message}`, 'error');
            }
        }
        
        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            try {
                await fetch(`${API_BASE}/Task/${taskId}`, {
                    method: 'DELETE'
                });
                showMessage('Task deleted!', 'success');
                loadTasks();
                closeTaskModal();
            } catch (error) {
                showMessage(`Error deleting task: ${error.message}`, 'error');
            }
        }
        
        async function toggleComplete(taskId, currentStatus) {
            try {
                await callService('TaskService', 'MarkComplete', [taskId, !currentStatus]);
                showMessage('Task updated!', 'success');
                loadTasks();
            } catch (error) {
                showMessage(`Error updating task: ${error.message}`, 'error');
            }
        }
        
        // Display Functions
        function displayTasks() {
            const container = document.getElementById('tasksContainer');
            let tasks = allTasks;
            
            if (currentFilter !== 'all') {
                tasks = tasks.filter(task => task.Status === currentFilter);
            }
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No tasks found</h3>
                        <p>Create your first task to get started!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-card ${task.IsCompleted ? 'completed' : ''} priority-${getPriorityClass(task.Priority)}"
                     onclick="showTaskDetail(${task.ID})">
                    <div class="task-title">${escapeHtml(task.Title)}</div>
                    <div class="task-description">${escapeHtml(task.Description || 'No description')}</div>
                    <div class="task-meta">
                        <span class="badge badge-priority ${getPriorityClass(task.Priority)}">
                            ${getPriorityName(task.Priority)}
                        </span>
                        <span class="badge badge-status">${task.Status}</span>
                        ${task.DueDate ? `<span>📅 ${formatDate(task.DueDate)}</span>` : ''}
                    </div>
                    <div class="task-tags" id="tags-${task.ID}"></div>
                    <div class="task-actions" onclick="event.stopPropagation()">
                        <button class="btn-small ${task.IsCompleted ? 'btn-secondary' : 'btn-success'}"
                                onclick="toggleComplete(${task.ID}, ${task.IsCompleted})">
                            ${task.IsCompleted ? '↩️ Reopen' : '✓ Complete'}
                        </button>
                        <button class="btn-small btn-danger" onclick="deleteTask(${task.ID})">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Load tags for each task
            tasks.forEach(task => loadTaskTags(task.ID));
        }
        
        async function loadTaskTags(taskId) {
            try {
                const tags = await callService('TagService', 'GetTaskTags', [taskId]);
                const container = document.getElementById(`tags-${taskId}`);
                if (container && tags && tags.length > 0) {
                    container.innerHTML = tags.map(tag => 
                        `<span class="tag" style="background-color: ${tag.Color}">${escapeHtml(tag.Name)}</span>`
                    ).join('');
                }
            } catch (error) {
                console.error(`Error loading tags for task ${taskId}:`, error);
            }
        }
        
        async function showTaskDetail(taskId) {
            currentTaskId = taskId;
            const task = allTasks.find(t => t.ID === taskId);
            if (!task) return;
            
            document.getElementById('modalTaskTitle').textContent = task.Title;
            
            let content = `
                <div style="margin-bottom: 20px;">
                    <p><strong>Description:</strong> ${escapeHtml(task.Description || 'No description')}</p>
                    <p><strong>Priority:</strong> <span class="badge badge-priority ${getPriorityClass(task.Priority)}">${getPriorityName(task.Priority)}</span></p>
                    <p><strong>Status:</strong> ${task.Status}</p>
                    <p><strong>Due Date:</strong> ${formatDate(task.DueDate)}</p>
                    <p><strong>Created:</strong> ${formatDate(task.CreatedAt)}</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3>Tags</h3>
                    <div id="taskDetailTags"></div>
                    <div style="margin-top: 10px;">
                        <select id="addTagSelect" style="width: 200px; display: inline-block; margin-right: 10px;">
                            <option value="">-- Select Tag --</option>
                        </select>
                        <button class="btn-small" onclick="addTagToTask()">Add Tag</button>
                    </div>
                </div>
                
                <div class="comments-section">
                    <h3>Comments</h3>
                    <div id="commentsContainer"></div>
                    
                    <h4 style="margin-top: 20px;">Add Comment</h4>
                    <form id="addCommentForm" onsubmit="addComment(event)">
                        <div class="form-group">
                            <input type="text" id="commentAuthor" placeholder="Your name" required>
                        </div>
                        <div class="form-group">
                            <textarea id="commentContent" placeholder="Write a comment..." required></textarea>
                        </div>
                        <button type="submit">Add Comment</button>
                    </form>
                </div>
            `;
            
            document.getElementById('modalTaskContent').innerHTML = content;
            document.getElementById('taskModal').classList.add('active');
            
            // Populate tag select
            const tagSelect = document.getElementById('addTagSelect');
            allTags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag.ID;
                option.textContent = tag.Name;
                tagSelect.appendChild(option);
            });
            
            loadTaskDetailTags(taskId);
            loadComments(taskId);
        }
        
        async function loadTaskDetailTags(taskId) {
            try {
                const tags = await callService('TagService', 'GetTaskTags', [taskId]);
                const container = document.getElementById('taskDetailTags');
                
                if (tags && tags.length > 0) {
                    container.innerHTML = tags.map(tag => `
                        <span class="tag-item" style="background-color: ${tag.Color}20; color: ${tag.Color}; border: 1px solid ${tag.Color};">
                            <span class="tag-color" style="background-color: ${tag.Color}"></span>
                            ${escapeHtml(tag.Name)}
                            <button class="btn-small" style="padding: 2px 6px; margin-left: 5px;" 
                                    onclick="removeTagFromTask(${tag.ID})">×</button>
                        </span>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: #999;">No tags assigned</p>';
                }
            } catch (error) {
                console.error('Error loading task tags:', error);
            }
        }
        
        async function addTagToTask() {
            const tagId = parseInt(document.getElementById('addTagSelect').value);
            if (!tagId) return;
            
            try {
                await callService('TagService', 'AddTagToTask', [currentTaskId, tagId]);
                showMessage('Tag added!', 'success');
                loadTaskDetailTags(currentTaskId);
                loadTasks(); // Refresh main view
            } catch (error) {
                showMessage(`Error adding tag: ${error.message}`, 'error');
            }
        }
        
        async function removeTagFromTask(tagId) {
            try {
                await callService('TagService', 'RemoveTagFromTask', [currentTaskId, tagId]);
                showMessage('Tag removed!', 'success');
                loadTaskDetailTags(currentTaskId);
                loadTasks(); // Refresh main view
            } catch (error) {
                showMessage(`Error removing tag: ${error.message}`, 'error');
            }
        }
        
        async function loadComments(taskId) {
            try {
                const comments = await callService('CommentService', 'GetTaskComments', [taskId]);
                const container = document.getElementById('commentsContainer');
                
                if (comments && comments.length > 0) {
                    container.innerHTML = comments.map(comment => `
                        <div class="comment">
                            <div class="comment-header">
                                <span class="comment-author">${escapeHtml(comment.Author)}</span>
                                <span class="comment-date">${formatDate(comment.CreatedAt)}</span>
                            </div>
                            <div class="comment-content">${escapeHtml(comment.Content)}</div>
                            <div class="comment-actions">
                                <button class="btn-small btn-danger" onclick="deleteComment(${comment.ID})">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="color: #999;">No comments yet. Be the first to comment!</p>';
                }
            } catch (error) {
                console.error('Error loading comments:', error);
            }
        }
        
        async function addComment(e) {
            e.preventDefault();
            
            const author = document.getElementById('commentAuthor').value;
            const content = document.getElementById('commentContent').value;
            
            try {
                await callService('CommentService', 'CreateComment', [currentTaskId, content, author]);
                showMessage('Comment added!', 'success');
                document.getElementById('addCommentForm').reset();
                loadComments(currentTaskId);
            } catch (error) {
                showMessage(`Error adding comment: ${error.message}`, 'error');
            }
        }
        
        async function deleteComment(commentId) {
            if (!confirm('Delete this comment?')) return;
            
            try {
                await callService('CommentService', 'DeleteComment', [commentId]);
                showMessage('Comment deleted!', 'success');
                loadComments(currentTaskId);
            } catch (error) {
                showMessage(`Error deleting comment: ${error.message}`, 'error');
            }
        }
        
        function displayTagsList() {
            const container = document.getElementById('tagsList');
            if (!allTags || allTags.length === 0) {
                container.innerHTML = '<p style="color: #999; font-size: 0.9em;">No tags yet</p>';
                return;
            }
            
            container.innerHTML = '<div style="font-size: 0.9em;">' + allTags.map(tag => `
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 5px; background: ${tag.Color}20; border-radius: 5px;">
                    <span class="tag-color" style="background-color: ${tag.Color}; width: 12px; height: 12px;"></span>
                    <span style="flex: 1;">${escapeHtml(tag.Name)}</span>
                </div>
            `).join('') + '</div>';
        }
        
        function updateStats() {
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.IsCompleted).length;
            const pending = allTasks.filter(t => t.Status === 'pending').length;
            const inProgress = allTasks.filter(t => t.Status === 'in_progress').length;
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${pending}</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${inProgress}</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${completed}</div>
                    <div class="stat-label">Completed</div>
                </div>
            `;
        }
        
        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
            currentTaskId = null;
        }
        
        function showMessage(text, type = 'success') {
            const container = document.getElementById('messageContainer');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            container.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 5000);
        }
        
        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function getPriorityClass(priority) {
            return priority === 3 ? 'high' : priority === 2 ? 'medium' : 'low';
        }
        
        function getPriorityName(priority) {
            return priority === 3 ? 'High' : priority === 2 ? 'Medium' : 'Low';
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Not set';
            const date = new Date(dateStr);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }
    </script>
</body>
</html>
